<!-- Canonical flat long-sleeve shirt for the Why diagram. Measurement conventions match engine/src/types.ts:
     chest = pit-to-pit flat, length = high shoulder point to hem, sleeve = shoulder seam to cuff.
     Colours: replace currentColor via CSS (stroke: var(--ink)). Labels are placed by each direction. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round">
  <!-- outline: neck, right shoulder, right sleeve, right side, hem, left side, left sleeve, left shoulder -->
  <path d="M250 40 Q320 100 390 40 L470 72 L590 332 L540 358 L455 210 L455 600 L185 600 L185 210 L100 358 L50 332 L170 72 Z"/>
  <!-- collar band -->
  <path d="M250 40 Q320 82 390 40" opacity="0.6"/>
  <!-- chest: pit to pit, flat -->
  <g class="dim dim-chest">
    <line x1="185" y1="232" x2="455" y2="232"/>
    <line x1="185" y1="224" x2="185" y2="240"/><line x1="455" y1="224" x2="455" y2="240"/>
  </g>
  <!-- length: high shoulder point to hem, drawn inside the left panel -->
  <g class="dim dim-length">
    <line x1="215" y1="52" x2="215" y2="600"/>
    <line x1="207" y1="52" x2="223" y2="52"/><line x1="207" y1="600" x2="223" y2="600"/>
  </g>
  <!-- sleeve: shoulder seam to cuff, offset 30 units outside the outer sleeve edge -->
  <g class="dim dim-sleeve">
    <line x1="497" y1="59" x2="617" y2="319"/>
    <line x1="490" y1="62" x2="504" y2="56"/><line x1="610" y1="322" x2="624" y2="316"/>
  </g>
  <!-- Suggested label anchors (viewBox units): chest ~ (320, 262) centred below the line;
       length ~ (235, 420) left-aligned beside the line; sleeve ~ (600, 170) left-aligned. -->
</svg>
